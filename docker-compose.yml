name: uzcyberwatch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ucw
      POSTGRES_PASSWORD: ucw
      POSTGRES_DB: uzcyberwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucw -d uzcyberwatch"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]

  api:
    build: .
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes: ["./:/srv"]

  collector:
    build: .
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    command: python -m app.collectors.ct_log
    restart: unless-stopped
    volumes: ["./:/srv"]

  honeypot:
    build: .
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    command: python -m app.collectors.honeypot --port 8088 --min-risk 20
    ports: ["8088:8088"]
    restart: unless-stopped
    volumes: ["./:/srv"]

  ti-feed:
    build: .
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    command: python -m app.collectors.ti_feed --interval 3600 --min-risk 30
    restart: unless-stopped
    volumes: ["./:/srv"]

volumes:
  pgdata:
  redisdata:
